[project]
name = "tracelab"
version = "0.1.0"
description = "Performance regression analysis that tells a real regression from a noisy machine, with the evidence to check it."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rajeev Chaurasia", email = "rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "psutil>=7.2.2",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
tracelab = "tracelab.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelab"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# script/ and tests/ are imported as packages from the repository root but are
# neither installed nor under src, so isort would otherwise file them as third
# party.
known-first-party = ["tracelab", "script", "tests", "evaluation"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "script", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/tracelab"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
