# Written before the v2 corpus was collected, and not tuned against it.
#
# Two changes from v1, each traced to a cause in v1's published failure rather
# than fitted to its table:
#
# - confirm_regressions. v1's same-code false regressions came from a burst of
#   load that hit only the candidate runs. A second batch run later is the one
#   defence that does not depend on the rig noticing the load.
# - No noise allowance above the threshold. v1 let p95 through with run-to-run
#   noise up to 10% against a 5% threshold, which admits a metric whose noise
#   alone exceeds the change it is asked to judge.
#
# The workload also changed: 200 measured repetitions instead of 30, because a
# p95 over thirty samples of a sub-millisecond kernel is set by one or two
# scheduler hiccups.
benchmark = "matmul"
baseline_window = 20
min_baseline_runs = 5
min_candidate_runs = 3
confidence = 0.95
n_boot = 2000
max_baseline_noise = 0.05
confirm_regressions = true

[[metrics]]
metric = "iteration_latency"
statistic = "median"
threshold = 0.03
role = "critical"

[[metrics]]
metric = "iteration_latency"
statistic = "p95"
threshold = 0.05
role = "critical"

[[metrics]]
metric = "max_rss"
statistic = "median"
threshold = 0.05
role = "guardrail"
